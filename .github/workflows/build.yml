name: Build TWRP TB375FC

on:
  workflow_dispatch:
    inputs:
      manifest_url:
        description: 'TWRP minimal manifest URL'
        required: false
        default: 'https://github.com/TWRP-Test/platform_manifest_twrp_aosp'
      manifest_branch:
        description: 'Manifest branch (TWRP 4.0 = twrp-16.0)'
        required: false
        default: 'twrp-16.0'
      device_path:
        description: 'Device tree path inside the source tree'
        required: false
        default: 'lenovo/tb375fc'
      lunch_target:
        description: 'Lunch target'
        required: false
        default: 'twrp_tb375fc-aosp_current-eng'
      build_partition:
        description: 'Partition to build (this tablet has no recovery partition)'
        required: false
        default: 'vendor_boot'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Compute build metadata
        id: meta
        run: |
          TS=$(date -u +%Y%m%d-%H%M%S)
          SHA7=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "ts=$TS"          >> "$GITHUB_OUTPUT"
          echo "sha7=$SHA7"      >> "$GITHUB_OUTPUT"
          echo "outname=vendor_boot_tb375fc_${TS}_${SHA7}" >> "$GITHUB_OUTPUT"

      - name: Free disk space
        run: |
          set -x
          sudo rm -rf /opt/hostedtoolcache
          sudo rm -rf /usr/local/lib/android/sdk
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/lib/jvm
          sudo rm -rf /usr/local/.ghcup
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo apt-get clean
          df -h

      - name: Set up swap
        run: |
          set -x
          free -h
          # The hosted runner already keeps /swapfile mounted as swap, so
          # fallocate/dd on that path fail with "Text file busy" (this killed
          # run #1 after 3m). Only create swap when there is none, and never
          # fail the job over it.
          SWAP_KB=$(awk '/^SwapTotal/ {print $2}' /proc/meminfo)
          echo "existing swap: ${SWAP_KB:-0} kB"
          if [ "${SWAP_KB:-0}" -lt 10000000 ]; then
            sudo swapoff -a || true
            sudo rm -f /swapfile || true
            sudo fallocate -l 10G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=10240 status=none || true
            sudo chmod 600 /swapfile || true
            sudo mkswap /swapfile || true
            sudo swapon /swapfile || true
          else
            echo "runner already has enough swap, skipping"
          fi
          free -h
          exit 0

      - name: Install dependencies
        run: |
          set -x
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends git-core gnupg flex bison build-essential \
            zip unzip curl wget rsync libc6-dev-i386 lib32ncurses5-dev x11proto-core-dev \
            libx11-dev lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc fontconfig lz4 \
            python3 python-is-python3 ccache

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1
        with:
          max-size: 4G

      - name: Init repo
        env:
          MANIFEST_URL: ${{ inputs.manifest_url }}
          MANIFEST_BRANCH: ${{ inputs.manifest_branch }}
        run: |
          set -eo pipefail
          git config --global user.name  "ci-builder"
          git config --global user.email "ci@localhost"
          git config --global color.ui false
          mkdir -p ~/bin
          curl -s https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          export PATH=~/bin:$PATH
          mkdir -p workspace && cd workspace
          echo "== repo init: $MANIFEST_URL / $MANIFEST_BRANCH =="
          repo init --depth=1 --no-clone-bundle -u "$MANIFEST_URL" -b "$MANIFEST_BRANCH" 2>&1 | tail -40

      - name: Repo sync
        env:
          MANIFEST_URL: ${{ inputs.manifest_url }}
          MANIFEST_BRANCH: ${{ inputs.manifest_branch }}
        run: |
          set -x
          export PATH=~/bin:$PATH
          cd workspace
          mkdir -p artifacts
          df -h
          echo "== starting sync at $(date -u) =="
          ( while true; do sleep 300; echo "[heartbeat $(date -u)] .repo=$(du -sh .repo 2>/dev/null | cut -f1) freeRoot=$(df -h / | awk 'NR==2{print $4}')"; done ) &
          HB=$!
          repo sync -c -j4 --force-sync --no-clone-bundle --no-tags > /tmp/repo_sync.log 2>&1
          RC=$?
          kill $HB 2>/dev/null || true
          tail -80 /tmp/repo_sync.log
          cp /tmp/repo_sync.log artifacts/repo_sync.log || true
          df -h
          echo "== sync finished rc=$RC at $(date -u) =="
          exit $RC

      - name: Drop .repo to free disk
        run: |
          # AOSP-16 sync leaves ~111 GB used / 35 GB free, and out/ needs 25-30 GB.
          # Run #5 died 5 min into `mka` without a usable log, so buy margin first:
          # repo metadata is not needed any more (place device tree clones fresh).
          cd workspace
          du -sh .repo 2>/dev/null || true
          rm -rf .repo
          df -h /

      - name: Place device tree
        env:
          DEVICE_PATH: ${{ inputs.device_path }}
        run: |
          set -eo pipefail
          cd workspace
          rm -rf "device/$DEVICE_PATH"
          mkdir -p "device/$(dirname "$DEVICE_PATH")"
          git clone --depth=1 "https://github.com/${GITHUB_REPOSITORY}" "device/$DEVICE_PATH"
          ls "device/$DEVICE_PATH"
          echo "--- kernel prebuilts (optional) ---"
          # vendor_boot has no kernel segment (proved by the stock v4 header);
          # the kernel comes from the stock boot.img, so absent prebuilts are fine.
          ls -l kernel/prebuilts/6.1/arm64/ 2>/dev/null || echo "kernel/prebuilts/6.1/arm64 absent - not needed (TARGET_NO_KERNEL=true)"

      - name: Build
        env:
          DEVICE_PATH: ${{ inputs.device_path }}
          LUNCH_TARGET: ${{ inputs.lunch_target }}
          BUILD_PARTITION: ${{ inputs.build_partition }}
        run: |
          set -x
          cd workspace
          # Run #7 pinned it down: the TERM trap's dmesg shows
          #   oom-kill ... task_memcg=/system.slice/hosted-compute-agent.service
          #   Out of memory: Killed process 18243 (soong_build) anon-rss:14068048kB
          # i.e. soong_build ate 13.4 GB while parsing Android.bp and the 15 GB
          # cgroup OOM-killed it, which the runner reports as the bogus
          # "runner has received a shutdown signal". soong_build is a Go binary,
          # so GOMEMLIMIT/GOGC are the real knobs: cap the heap, GC earlier.
          export GOMEMLIMIT=8GiB
          export GOGC=25
          source build/envsetup.sh
          # The runner's shell is `bash -e`, so a failing lunch aborts the script
          # before its log can be printed or copied (run #3 lost lunch.log this
          # way). Keep -e off around the two build steps.
          set +e
          lunch "$LUNCH_TARGET" > /tmp/lunch.log 2>&1
          LUNCH_RC=$?
          echo "== lunch rc=$LUNCH_RC =="
          tail -n 200 /tmp/lunch.log
          cp /tmp/lunch.log artifacts/lunch.log || true
          if [ $LUNCH_RC -ne 0 ]; then
            echo "lunch failed rc=$LUNCH_RC"
            exit $LUNCH_RC
          fi
          echo "== TARGET_DEVICE=$TARGET_DEVICE =="
          # Run #5: lunch finally parsed, then the job was killed 5 min into mka
          # with exit 143 ("runner has received a shutdown signal") and not a
          # single line of compiler output survived (build.log was redirected to
          # /tmp and the step never reached the copy). Stream mka to stdout as
          # well, and copy the log from a TERM/INT trap, so a future kill still
          # leaves evidence behind.
          # Run #6 shows the job is killed right as soong_build finishes its
          # ~6 min silent Android.bp parse and ninja is about to fan out. Dump
          # kernel messages from the trap so the next kill proves or rules out OOM.
          trap 'cp /tmp/build.log artifacts/build.log 2>/dev/null || true; echo "== trapped TERM/INT =="; free -h || true; df -h / || true; (dmesg 2>/dev/null || sudo dmesg 2>/dev/null) | tail -80 || true; exit 143' TERM INT
          set -o pipefail
          # -j2 instead of -j4: halve the peak memory of the ninja fan-out.
          mka -j2 "${BUILD_PARTITION}image" 2>&1 | tee /tmp/build.log
          BUILD_RC=${PIPESTATUS[0]}
          trap - TERM INT
          echo "== build rc=$BUILD_RC at $(date -u) =="
          tail -n 300 /tmp/build.log
          cp /tmp/build.log artifacts/build.log || true
          df -h / || true
          free -h || true
          exit $BUILD_RC

      - name: Collect artifact
        if: always()
        id: collect
        env:
          OUTNAME: ${{ steps.meta.outputs.outname }}
          BUILD_PARTITION: ${{ inputs.build_partition }}
        run: |
          set -eo pipefail
          cd workspace
          OUT="out/target/product/tb375fc"
          ls -l "$OUT"/*.img 2>/dev/null || true
          SRC=""
          for cand in "$OUT/${BUILD_PARTITION}.img" "$OUT/vendor_boot.img" "$OUT/recovery.img" "$OUT/boot.img"; do
            if [ -f "$cand" ]; then SRC="$cand"; break; fi
          done
          if [ -z "$SRC" ]; then echo "no image produced"; exit 1; fi
          cp "$SRC" "artifacts/${OUTNAME}.img"
          {
            echo "name=${OUTNAME}"
            echo "source=$SRC"
            echo "size=$(stat -c%s "$SRC")"
            echo "md5=$(md5sum "$SRC" | cut -d' ' -f1)"
            echo "sha256=$(sha256sum "$SRC" | cut -d' ' -f1)"
            echo "commit=${{ github.sha }}"
            echo "lunch=${{ inputs.lunch_target }}"
            echo "manifest=${{ inputs.manifest_url }}@${{ inputs.manifest_branch }}"
            echo "built_utc=$(date -u)"
          } | tee "artifacts/${OUTNAME}.build_info.txt"

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.outname }}
          path: workspace/artifacts/*
          if-no-files-found: warn
          retention-days: 30
