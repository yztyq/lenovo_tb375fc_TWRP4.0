name: Build TWRP TB375FC

on:
  workflow_dispatch:
    inputs:
      manifest_url:
        description: 'TWRP minimal manifest URL'
        required: false
        default: 'https://github.com/TWRP-Test/platform_manifest_twrp_aosp'
      manifest_branch:
        description: 'Manifest branch (TWRP 4.0 = twrp-16.0)'
        required: false
        default: 'twrp-16.0'
      device_path:
        description: 'Device tree path inside the source tree'
        required: false
        default: 'lenovo/tb375fc'
      lunch_target:
        description: 'Lunch target'
        required: false
        default: 'twrp_tb375fc-aosp_current-eng'
      build_partition:
        description: 'Partition to build (this tablet has no recovery partition)'
        required: false
        default: 'vendor_boot'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 发布 Release 需要写权限（默认 GITHUB_TOKEN 在 fork/私有仓库上通常是只读）
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360

    steps:
      - name: Compute build metadata
        id: meta
        run: |
          TS=$(date -u +%Y%m%d-%H%M%S)
          SHA7=$(echo "${{ github.sha }}" | cut -c1-7)
          echo "ts=$TS"          >> "$GITHUB_OUTPUT"
          echo "sha7=$SHA7"      >> "$GITHUB_OUTPUT"
          echo "outname=vendor_boot_tb375fc_${TS}_${SHA7}" >> "$GITHUB_OUTPUT"

      - name: Free disk space
        run: |
          set -x
          sudo rm -rf /opt/hostedtoolcache
          sudo rm -rf /usr/local/lib/android/sdk
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/lib/jvm
          sudo rm -rf /usr/local/.ghcup
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo apt-get clean
          df -h

      - name: Set up swap
        run: |
          set -x
          free -h
          # The hosted runner already keeps /swapfile mounted as swap, so
          # fallocate/dd on that path fail with "Text file busy" (this killed
          # run #1 after 3m). Only create swap when there is none, and never
          # fail the job over it.
          SWAP_KB=$(awk '/^SwapTotal/ {print $2}' /proc/meminfo)
          echo "existing swap: ${SWAP_KB:-0} kB"
          if [ "${SWAP_KB:-0}" -lt 20000000 ]; then
            sudo swapoff -a || true
            sudo rm -f /swapfile || true
            sudo fallocate -l 20G /swapfile || sudo dd if=/dev/zero of=/swapfile bs=1M count=20480 status=none || true
            sudo chmod 600 /swapfile || true
            sudo mkswap /swapfile || true
            sudo swapon /swapfile || true
          else
            echo "runner already has enough swap, skipping"
          fi
          free -h
          exit 0

      - name: Install dependencies
        run: |
          set -x
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends git-core gnupg flex bison build-essential \
            zip unzip curl wget rsync libc6-dev-i386 lib32ncurses5-dev x11proto-core-dev \
            libx11-dev lib32z1-dev libgl1-mesa-dev libxml2-utils xsltproc fontconfig lz4 \
            python3 python-is-python3 python3-pip ccache
          # scripts/splice_platform.py 需要 zstandard（把 recovery 分片重编码成 0000+zstd）
          python3 -m pip install --user zstandard

      - name: Setup ccache
        uses: hendrikmuhs/ccache-action@v1
        with:
          max-size: 4G

      - name: Init repo
        env:
          MANIFEST_URL: ${{ inputs.manifest_url }}
          MANIFEST_BRANCH: ${{ inputs.manifest_branch }}
        run: |
          set -eo pipefail
          git config --global user.name  "ci-builder"
          git config --global user.email "ci@localhost"
          git config --global color.ui false
          mkdir -p ~/bin
          curl -s https://storage.googleapis.com/git-repo-downloads/repo > ~/bin/repo
          chmod a+x ~/bin/repo
          export PATH=~/bin:$PATH
          mkdir -p workspace && cd workspace
          echo "== repo init: $MANIFEST_URL / $MANIFEST_BRANCH =="
          repo init --depth=1 --no-clone-bundle -u "$MANIFEST_URL" -b "$MANIFEST_BRANCH" 2>&1 | tail -40

      - name: Repo sync
        env:
          MANIFEST_URL: ${{ inputs.manifest_url }}
          MANIFEST_BRANCH: ${{ inputs.manifest_branch }}
        run: |
          set -x
          export PATH=~/bin:$PATH
          cd workspace
          mkdir -p artifacts
          df -h
          echo "== starting sync at $(date -u) =="
          ( while true; do sleep 300; echo "[heartbeat $(date -u)] .repo=$(du -sh .repo 2>/dev/null | cut -f1) freeRoot=$(df -h / | awk 'NR==2{print $4}')"; done ) &
          HB=$!
          repo sync -c -j4 --force-sync --no-clone-bundle --no-tags > /tmp/repo_sync.log 2>&1
          RC=$?
          kill $HB 2>/dev/null || true
          tail -80 /tmp/repo_sync.log
          cp /tmp/repo_sync.log artifacts/repo_sync.log || true
          df -h
          echo "== sync finished rc=$RC at $(date -u) =="
          exit $RC

      - name: Drop .repo to free disk
        run: |
          # AOSP-16 sync leaves ~111 GB used / 35 GB free, and out/ needs 25-30 GB.
          # Run #5 died 5 min into `mka` without a usable log, so buy margin first:
          # repo metadata is not needed any more (place device tree clones fresh).
          cd workspace
          du -sh .repo 2>/dev/null || true
          rm -rf .repo
          df -h /

      - name: Place device tree
        env:
          DEVICE_PATH: ${{ inputs.device_path }}
        run: |
          set -eo pipefail
          cd workspace
          rm -rf "device/$DEVICE_PATH"
          mkdir -p "device/$(dirname "$DEVICE_PATH")"
          git clone --depth=1 "https://github.com/${GITHUB_REPOSITORY}" "device/$DEVICE_PATH"
          ls "device/$DEVICE_PATH"
          echo "--- kernel prebuilts (optional) ---"
          # vendor_boot has no kernel segment (proved by the stock v4 header);
          # the kernel comes from the stock boot.img, so absent prebuilts are fine.
          ls -l kernel/prebuilts/6.1/arm64/ 2>/dev/null || echo "kernel/prebuilts/6.1/arm64 absent - not needed (TARGET_NO_KERNEL=true)"

      - name: Patch TWRP DRM backend for MediaTek
        # 实机日志：TWRP DRM: display 0 found 0/2 primary planes for CRTC index 0
        # -> Failed to init display -> gui2: minui display initialization failed
        # -> E:GUI2 exited with error 1.，recovery 反复重启后掉 bootloader。
        # 本机没有 fbdev 后备（recovery 里 /dev/graphics、/proc/fb 都不存在），
        # 只能让 mediatek-drm 走 legacy KMS（drmModeSetCrtc + dumb buffer）。
        env:
          DEVICE_PATH: ${{ inputs.device_path }}
        run: |
          set -eo pipefail
          cd workspace
          F=bootable/recovery/twrpminui/graphics_drm.cpp
          test -f "$F" || { echo "missing $F"; exit 4; }
          python3 "device/$DEVICE_PATH/scripts/patch_drm_legacy.py" "$F"
          grep -n 'legacy_modeset = version->name' -A4 "$F"

      - name: Build
        id: build
        env:
          DEVICE_PATH: ${{ inputs.device_path }}
          LUNCH_TARGET: ${{ inputs.lunch_target }}
          BUILD_PARTITION: ${{ inputs.build_partition }}
        run: |
          set -x
          cd workspace
          # Run #8 pinned it down: dmesg shows soong_build killed at 14.2 GB
          # anon-rss with RAM (15 GB) and the entire 9 GB swap consumed. The
          # lighter two-segment combo `twrp_tb375fc-eng` is rejected by AOSP 16
          # ("Invalid lunch combo"), so the bp-parse set cannot be shrunk that
          # way; instead give the box 20 GB of swap below and bound the Go heap.
          # Run #7 pinned it down: the TERM trap's dmesg shows
          #   oom-kill ... task_memcg=/system.slice/hosted-compute-agent.service
          #   Out of memory: Killed process 18243 (soong_build) anon-rss:14068048kB
          # i.e. soong_build ate 13.4 GB while parsing Android.bp and the 15 GB
          # cgroup OOM-killed it, which the runner reports as the bogus
          # "runner has received a shutdown signal". soong_build is a Go binary,
          # so GOMEMLIMIT/GOGC are the real knobs: cap the heap, GC earlier.
          export GOMEMLIMIT=8GiB
          export GOGC=25
          source build/envsetup.sh
          # The runner's shell is `bash -e`, so a failing lunch aborts the script
          # before its log can be printed or copied (run #3 lost lunch.log this
          # way). Keep -e off around the two build steps.
          set +e
          lunch "$LUNCH_TARGET" > /tmp/lunch.log 2>&1
          LUNCH_RC=$?
          echo "== lunch rc=$LUNCH_RC =="
          tail -n 200 /tmp/lunch.log
          cp /tmp/lunch.log artifacts/lunch.log || true
          if [ $LUNCH_RC -ne 0 ]; then
            echo "lunch failed rc=$LUNCH_RC"
            exit $LUNCH_RC
          fi
          echo "== TARGET_DEVICE=$TARGET_DEVICE =="
          # TARGET_NO_KERNEL=true means AOSP only creates $OUT/root as a side effect
          # of the boot ramdisk rule; anything that rsyncs from $OUT/root earlier
          # dies with "link_stat .../root failed: No such file or directory".
          # Pre-create the staging dirs so the ordering is deterministic.
          mkdir -p "$OUT/root" "$OUT/vendor_ramdisk"
          # same as ofox16 run#15: the recovery-ramdisk rule runs the ROM's
          # pre-image hooks (magiskboot into sbin/, ld.config.txt into linkerconfig/)
          # BEFORE the "cp -rf device/.../recovery/root" step, and MOVE mode would
          # otherwise leave an empty recovery root with no sbin/. Pre-seed it.
          mkdir -p "$OUT/recovery/root"
          rsync -a "device/$DEVICE_PATH/recovery/root/" "$OUT/recovery/root/"
          mkdir -p "$OUT/recovery/root/sbin" "$OUT/recovery/root/linkerconfig" \
                   "$OUT/recovery/root/system/etc" "$OUT/recovery/root/system/bin"
          ls -d "$OUT/recovery/root/sbin" "$OUT/recovery/root/linkerconfig"
          # Run #5: lunch finally parsed, then the job was killed 5 min into mka
          # with exit 143 ("runner has received a shutdown signal") and not a
          # single line of compiler output survived (build.log was redirected to
          # /tmp and the step never reached the copy). Stream mka to stdout as
          # well, and copy the log from a TERM/INT trap, so a future kill still
          # leaves evidence behind.
          # Run #6 shows the job is killed right as soong_build finishes its
          # ~6 min silent Android.bp parse and ninja is about to fan out. Dump
          # kernel messages from the trap so the next kill proves or rules out OOM.
          trap 'cp /tmp/build.log artifacts/build.log 2>/dev/null || true; echo "== trapped TERM/INT =="; free -h || true; df -h / || true; (dmesg 2>/dev/null || sudo dmesg 2>/dev/null) | tail -80 || true; exit 143' TERM INT
          set -o pipefail
          # Run #10 got all the way to ninja after 51 min and then failed with
          #   FAILED: ninja: unknown target 'vendor_bootimage', did you mean 'vendorbootimage'?
          # The AOSP target has no underscore; "${BUILD_PARTITION}image" was wrong.
          # -j2 instead of -j4 keeps the ninja fan-out memory low.
          mka -j2 vendorbootimage 2>&1 | tee /tmp/build.log
          BUILD_RC=${PIPESTATUS[0]}
          trap - TERM INT
          echo "== build rc=$BUILD_RC at $(date -u) =="
          tail -n 300 /tmp/build.log
          cp /tmp/build.log artifacts/build.log || true
          df -h / || true
          free -h || true
          OUT="out/target/product/tb375fc"
          REC=$(ls "$OUT"/obj/PACKAGING/vendor_ramdisk_fragments_intermediates/recovery.cpio* 2>/dev/null | head -n 1)
          DTB="$OUT/dtb.img"
          if [ "$BUILD_RC" -ne 0 ] && [ -n "$REC" ] && [ -f "$DTB" ]; then
            # 有些 TWRP/OF 分支的 system/tools/mkbootimg 是旧版，不认
            # --ramdisk_type / --vendor_ramdisk_fragment，最后一步 vendor_boot.img
            # 必然 ValueError。此时 recovery.cpio 和 dtb.img 都已编好，用零件拼。
            echo "== mkbootimg step failed (old mkbootimg.py) - have parts, continue =="
            echo "rec_path=$REC" >> "$GITHUB_OUTPUT"
            echo "dtb_path=$DTB" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          exit $BUILD_RC

      - name: Splice official platform ramdisk
        # 本树编出来的 vendor_boot 只有 recovery 一片（platform 片是 4 字节空片）。
        # 必须把官方 platform 片（含 222 个 6.1.138 模块）拼回去，并按 v4 规则重写
        # 分片表（platform type=1 / recovery type=2），否则刷进去进不了 recovery。
        if: always()
        id: splice
        env:
          DEVICE_PATH: ${{ inputs.device_path }}
          REC: ${{ steps.build.outputs.rec_path }}
          DTB: ${{ steps.build.outputs.dtb_path }}
        run: |
          cd workspace
          OUT="out/target/product/tb375fc"
          SRC=$(find "$OUT" -maxdepth 1 -name 'vendor_boot*.img' -size +1k 2>/dev/null | head -n 1)
          echo "vendor_boot.img: ${SRC:-<none>}  parts: rec=${REC:-<none>} dtb=${DTB:-<none>}"
          if [ -n "$SRC" ]; then
            python3 "device/$DEVICE_PATH/scripts/splice_platform.py" \
              --input "$SRC" \
              --platform "device/$DEVICE_PATH/prebuilt/platform_ramdisk.lz4" \
              --output "$OUT/vendor_boot_TWRP_64MB.img" \
              --size 67108864
          elif [ -n "$REC" ] && [ -n "$DTB" ]; then
            python3 "device/$DEVICE_PATH/scripts/splice_platform.py" \
              --recovery-cpio "$REC" \
              --dtb "$DTB" \
              --header "device/$DEVICE_PATH/prebuilt/vendor_boot_header.bin" \
              --platform "device/$DEVICE_PATH/prebuilt/platform_ramdisk.lz4" \
              --output "$OUT/vendor_boot_TWRP_64MB.img" \
              --size 67108864
          else
            echo "no vendor_boot*.img and no recovery.cpio parts - nothing to splice"
            exit 0
          fi
          ls -l "$OUT/vendor_boot_TWRP_64MB.img"
          md5sum "$OUT/vendor_boot_TWRP_64MB.img"
          # 分片表里 recovery 条目要带 board_id="recovery"（可用包就是这么写的），
          # 脚本里已经处理；这里把 vrs 打出来，方便和 56,436,946 B 的基准对照。
          python3 -c "import struct; b=open('out/target/product/tb375fc/vendor_boot_TWRP_64MB.img','rb').read(); print('vrs = %s B' % format(struct.unpack_from('<I', b, 24)[0], ','))"

      - name: Collect artifact
        if: always()
        id: collect
        env:
          OUTNAME: ${{ steps.meta.outputs.outname }}
          BUILD_PARTITION: ${{ inputs.build_partition }}
        run: |
          set -eo pipefail
          cd workspace
          OUT="out/target/product/tb375fc"
          ls -l "$OUT"/*.img 2>/dev/null || true
          SRC=""
          for cand in "$OUT/vendor_boot_TWRP_64MB.img" "$OUT/${BUILD_PARTITION}.img" "$OUT/vendor_boot.img" "$OUT/recovery.img" "$OUT/boot.img"; do
            if [ -f "$cand" ]; then SRC="$cand"; break; fi
          done
          if [ -z "$SRC" ]; then echo "no image produced"; exit 1; fi
          cp "$SRC" "artifacts/${OUTNAME}.img"
          {
            echo "name=${OUTNAME}"
            echo "source=$SRC"
            echo "size=$(stat -c%s "$SRC")"
            echo "md5=$(md5sum "$SRC" | cut -d' ' -f1)"
            echo "sha256=$(sha256sum "$SRC" | cut -d' ' -f1)"
            echo "commit=${{ github.sha }}"
            echo "lunch=${{ inputs.lunch_target }}"
            echo "manifest=${{ inputs.manifest_url }}@${{ inputs.manifest_branch }}"
            echo "built_utc=$(date -u)"
          } | tee "artifacts/${OUTNAME}.build_info.txt"

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.meta.outputs.outname }}
          path: workspace/artifacts/*
          if-no-files-found: warn
          retention-days: 30

      - name: Build release notes
        # 成包里有一张 vendor_boot*.img 才发 Release；没编出来就只留 artifact + 日志。
        if: always()
        id: relnotes
        env:
          OUTNAME: ${{ steps.meta.outputs.outname }}
        run: |
          cd workspace
          IMG=$(ls artifacts/*.img 2>/dev/null | head -n 1 || true)
          if [ -z "$IMG" ]; then
            echo "no image in artifacts - skip release"
            echo "has_img=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "has_img=true" >> "$GITHUB_OUTPUT"
          MB=$(awk -v b="$(stat -c%s "$IMG")" 'BEGIN{printf "%.1f", b/1048576}')
          {
            echo "## ${OUTNAME}"
            echo
            echo "| 项 | 值 |"
            echo "|---|---|"
            echo "| 文件 | \`$(basename "$IMG")\` |"
            echo "| 大小 | $(stat -c%s "$IMG") B (${MB} MiB) |"
            echo "| MD5 | \`$(md5sum "$IMG" | cut -d' ' -f1)\` |"
            echo "| SHA256 | \`$(sha256sum "$IMG" | cut -d' ' -f1)\` |"
            echo "| 提交 | \`${{ github.sha }}\` |"
            echo "| lunch | \`${{ inputs.lunch_target }}\` |"
            echo "| manifest | \`${{ inputs.manifest_url }}\` @ \`${{ inputs.manifest_branch }}\` |"
            echo "| 构建时间 (UTC) | ${{ steps.meta.outputs.ts }} |"
            echo
            echo "### 结构"
            echo "vendor_boot v4 两片：platform(type=1，官方 6.1.138 模块) + recovery(type=2，本树 OrangeFox/TWRP ramdisk)，"
            echo "镜像总大小 67,108,864 B (64 MiB)。"
            echo
            echo "### 刷入"
            echo '```'
            echo "adb reboot bootloader"
            echo "fastboot flash vendor_boot $(basename "$IMG")"
            echo "fastboot reboot recovery"
            echo '```'
            echo
            echo "刷之前先备份官方原片 vendor_boot.img（TB375FC_ZUX_1.1.04.287_Tool/image 下，"
            echo "vrs 26,902,388，md5 E60D9F853E08CDE9D099EA1143D760F8），用于回滚。"
            echo
            echo "### 注意"
            echo "- 本包未做实机验证，第一次刷入请准备好官方原片回滚。"
            echo "- 如果刷完能进 recovery 但重启又回系统，先排查 AVB footer。"
          } > release_notes.md
          cat release_notes.md

      - name: Publish release
        # 编译出来的 img 直接挂到 Releases，免得每次去 Actions 里点 artifact 包。
        if: steps.relnotes.outputs.has_img == 'true'
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: twrp-tb375fc-${{ steps.meta.outputs.ts }}
          name: TWRP 4.0 TB375FC ${{ steps.meta.outputs.ts }}
          body_path: workspace/release_notes.md
          prerelease: true
          fail_on_unmatched_files: false
          files: |
            workspace/artifacts/*.img
            workspace/artifacts/*.build_info.txt
